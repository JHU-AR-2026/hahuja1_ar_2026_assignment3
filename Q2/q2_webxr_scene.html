<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Assignment 3 - Q2 WebXR</title>
  <style>html, body, #renderCanvas { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }</style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const MODEL_ROOT = "./assets/";
const MODEL_FILE = "of_planes_and_satellites.glb";

const createScene = async () => {
  const scene = new BABYLON.Scene(engine);
  const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
  scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

  const xr = await scene.createDefaultXRExperienceAsync({
    uiOptions: { sessionMode: "immersive-ar", referenceSpaceType: "local-floor" },
    disableTeleportation: true,
  });

  const sessionManager = xr.baseExperience.sessionManager;

  xr.baseExperience.featuresManager.enableFeature(
    BABYLON.WebXRFeatureName.HIT_TEST, "latest", { disablePermanentHitTest: true }
  );

  let hitTestSource = null;
  let lastHitPosition = null;
  let lastHitRotationY = 0;

  sessionManager.onXRFrameObservable.add((frame) => {
    if (!hitTestSource) return;
    const results = frame.getHitTestResults(hitTestSource);
    if (results.length > 0) {
      const pose = results[0].getPose(sessionManager.referenceSpace);
      if (pose) {
        lastHitPosition = new BABYLON.Vector3(
          pose.transform.position.x, pose.transform.position.y, pose.transform.position.z
        );
        const o = pose.transform.orientation;
        lastHitRotationY = new BABYLON.Quaternion(o.x, o.y, o.z, o.w).toEulerAngles().y;
      }
    }
  });

  let lastSpawned = null;
  let initialPosition = null;
  let initialRotationY = 0;
  let initialScaling = null;

  let moveX = 0;
  let moveY = 0;
  let rotateX = 0;

  const spawnModel = async () => {
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", MODEL_ROOT, MODEL_FILE, scene);
    const mesh = result.meshes[0];
    mesh.rotationQuaternion = null;

    mesh.position = lastHitPosition.clone();
    mesh.rotation.y = lastHitRotationY;
    mesh.scaling = new BABYLON.Vector3(1, 1, 1);

    lastSpawned = mesh;
    initialPosition = mesh.position.clone();
    initialRotationY = mesh.rotation.y;
    initialScaling = mesh.scaling.clone();
  };

  xr.input.onControllerAddedObservable.add((controller) => {
    controller.onMotionControllerInitObservable.add(async (motionController) => {
      const handedness = controller.inputSource.handedness;

      if (handedness === "right") {
        try {
          hitTestSource = await sessionManager.session.requestHitTestSource({
            space: controller.inputSource.targetRaySpace,
          });
        } catch (err) {
          console.error("requestHitTestSource failed:", err);
        }

        const trigger = motionController.getComponent("xr-standard-trigger");
        trigger.onButtonStateChangedObservable.add(() => {
          if (trigger.pressed && lastHitPosition) {
            spawnModel();
          }
        });

        const moveStick = motionController.getComponent("xr-standard-thumbstick");
        moveStick.onAxisValueChangedObservable.add((axes) => {
          moveX = axes.x;
          moveY = axes.y;
        });

        const aButton = motionController.getComponent("a-button");
        aButton.onButtonStateChangedObservable.add(() => {
          if (aButton.pressed && lastSpawned) {
            lastSpawned.scaling.scaleInPlace(1.1);
          }
        });

        const bButton = motionController.getComponent("b-button");
        bButton.onButtonStateChangedObservable.add(() => {
          if (bButton.pressed && lastSpawned) {
            lastSpawned.scaling.scaleInPlace(1 / 1.1);
          }
        });
      }

      if (handedness === "left") {
        const rotateStick = motionController.getComponent("xr-standard-thumbstick");
        rotateStick.onAxisValueChangedObservable.add((axes) => {
          rotateX = axes.x;
        });

        const xButton = motionController.getComponent("x-button");
        xButton.onButtonStateChangedObservable.add(() => {
          if (xButton.pressed && lastSpawned) {
            lastSpawned.position = initialPosition.clone();
            lastSpawned.rotation.y = initialRotationY;
            lastSpawned.scaling = initialScaling.clone();
          }
        });
      }
    });
  });

  scene.onBeforeRenderObservable.add(() => {
    if (!lastSpawned) return;
    const dt = engine.getDeltaTime() / 1000;

    lastSpawned.position.x += moveX * dt;
    lastSpawned.position.z += -moveY * dt;
    lastSpawned.rotation.y += rotateX * dt;
  });

  return scene;
};

createScene().then((scene) => {
  engine.runRenderLoop(() => scene.render());
});
window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
